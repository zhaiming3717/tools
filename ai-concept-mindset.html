function textWidth(t, d) {
  const fonts = [
    '700 17px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif',
    '600 14px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif',
    '13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif'
  ];
  measure.font = fonts[d <= 2 ? d : 2];
  let s = measure.measureText(t).width;
  if (d === 0) s = Math.max(s, ROOT_W - PAD_X * 2);
  else if (d === 1) s = Math.max(s, L1_W - PAD_X * 2);
  return s + PAD_X * 2;
}
function nodeW(n) { if (n._w === undefined) n._w = textWidth(n.text, n.depth); return n._w; }

/* 每个节点：子节点总高度；被折叠时算自身高度 */
function nodeH(n) { return n.depth === 0 ? 36 : n.depth === 1 ? 30 : 26; }
function subtreeH(n) {
  if (!n.expanded || n.children.length === 0) { n._h = nodeH(n); return n._h; }
  let s = 0;
  n.children.forEach((c, i) => { s += subtreeH(c) + (i ? H_GAP : 0); });
  n._h = Math.max(nodeH(n), s);
  return n._h;
}
function layout(n, x, y) {
  n.x = x; n.y = y;
  nodeW(n);
  if (!n.expanded || n.children.length === 0) return;
  const cx = x + nodeW(n) + X_GAP;
  let acc = y + (nodeH(n) - subtreeH(n)) / 2;
  n.children.forEach(c => {
    const ch = subtreeH(c);
    layout(c, cx, acc + ch / 2 - nodeH(c) / 2);
    acc += ch + H_GAP;
  });
}

/* ---------- 渲染 ---------- */
const scene = document.getElementById("scene");
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function draw() {
  scene.innerHTML = "";
  subtreeH(DATA);
  layout(DATA, 20, 0);
  const NS = "http://www.w3.org/2000/svg";
  const links = document.createElementNS(NS, "g");
  const nodes = document.createElementNS(NS, "g");
  scene.appendChild(links); scene.appendChild(nodes);

  function walk(n) {
    if (n.children.length && n.expanded) {
      const x1 = n.x + nodeW(n), y1 = n.y + nodeH(n) / 2;
      const x2 = n.children[0].x;
      n.children.forEach(c => {
        const y2 = c.y + nodeH(c) / 2;
        const mx = (x1 + x2) / 2;
        const p = document.createElementNS(NS, "path");
        p.setAttribute("class", "link" + (n.depth === 0 ? " lvl1" : ""));
        p.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`);
        links.appendChild(p);
        walk(c);
      });
    }
    const [c1, c2] = COLORS[n.colorIdx] || ["#6366f1", "#818cf8"];
    const g = document.createElementNS(NS, "g");
    const w = nodeW(n), h = nodeH(n);
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("class", "box");
    r.setAttribute("x", n.x); r.setAttribute("y", n.y);
    r.setAttribute("width", w); r.setAttribute("height", h);
    r.setAttribute("rx", n.depth === 0 ? 10 : n.depth === 1 ? 8 : 6);
    if (n.depth === 0) { r.setAttribute("fill", "#1e2340"); r.setAttribute("stroke", "#7d8bff"); r.setAttribute("stroke-width", "2"); }
    else if (n.depth === 1) { r.setAttribute("fill", c1); r.setAttribute("stroke", c2); r.setAttribute("stroke-width", "1"); r.setAttribute("opacity", ".95"); }
    else { r.setAttribute("fill", "#1a1f36"); r.setAttribute("stroke", c1); r.setAttribute("stroke-width", "1.4"); r.setAttribute("opacity", ".92"); }
    g.appendChild(r);

    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", n.x + w / 2); t.setAttribute("y", n.y + h / 2 + .5);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("class", n.depth === 0 ? "root" : n.depth === 1 ? "lvl1" : "");
    t.textContent = n.text;
    g.appendChild(t);

    if (n.children.length) {
      const bg = document.createElementNS(NS, "g");
      bg.setAttribute("class", "badge");
      const cr = document.createElementNS(NS, "circle");
      cr.setAttribute("cx", n.x + w - 2); cr.setAttribute("cy", n.y + h / 2);
      cr.setAttribute("r", n.depth === 0 ? 10 : 8.5);
      cr.setAttribute("fill", n.depth <= 1 ? "#0f1220" : c1);
      cr.setAttribute("stroke", n.depth <= 1 ? "#7d8bff" : c2);
      cr.setAttribute("stroke-width", "1.4");
      bg.appendChild(cr);
      const bt = document.createElementNS(NS, "text");
      bt.setAttribute("x", n.x + w - 2); bt.setAttribute("y", n.y + h / 2 + .5);
      bt.setAttribute("text-anchor", "middle");
      bt.setAttribute("fill", n.depth <= 1 ? "#9aa8ff" : "#fff");
      bt.textContent = n.expanded ? "−" : "+";
      bg.appendChild(bt);
      bg.addEventListener("click", e => { e.stopPropagation(); n.expanded = !n.expanded; draw(); });
      g.appendChild(bg);
    }
    r.addEventListener("click", () => {
      if (!n.children.length) return;
      n.expanded = !n.expanded; draw();
    });
    g.dataset.id = n.text;
    nodes.appendChild(g);
  }
  walk(DATA);
}

/* ---------- 缩放 / 平移 ---------- */
const svg = document.getElementById("svg");
let vw = innerWidth, vh = innerHeight;
let tx = 60, ty = vh / 2, scale = 1;

function apply() {
  const minY = -600, maxY = 4000;
  scene.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
}
function clampScale(s) { return Math.max(.28, Math.min(2.4, s)); }
function zoomAt(factor, cx, cy) {
  const ns = clampScale(scale * factor);
  const k = ns / scale;
  tx = cx - (cx - tx) * k;
  ty = cy - (cy - ty) * k;
  scale = ns; apply();
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.deltaY < 0 ? 1.12 : 0.893, e.clientX, e.clientY);
}, { passive: false });

let dragging = false, sx = 0, sy = 0;
svg.addEventListener("mousedown", e => { dragging = true; sx = e.clientX; sy = e.clientY; svg.parentElement.classList.add("drag"); });
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  tx += e.clientX - sx; ty += e.clientY - sy;
  sx = e.clientX; sy = e.clientY; apply();
});
window.addEventListener("mouseup", () => { dragging = false; svg.parentElement.classList.remove("drag"); });
svg.addEventListener("touchstart", e => { if (e.touches.length === 1) { dragging = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
window.addEventListener("touchmove", e => {
  if (dragging && e.touches.length === 1) {
    tx += e.touches[0].clientX - sx; ty += e.touches[0].clientY - sy;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; apply(); e.preventDefault();
  }
}, { passive: false });
window.addEventListener("touchend", () => dragging = false);

/* ---------- 按钮 ---------- */
document.getElementById("expandAll").onclick = () => { setAll(DATA, true); draw(); fit(); };
document.getElementById("collapseAll").onclick = () => { setAll(DATA, false); DATA.children.forEach(c => { c.expanded = true; }); draw(); tx = 60; ty = innerHeight / 2; scale = 1; apply(); };
document.getElementById("zoomIn").onclick = () => zoomAt(1.25, innerWidth / 2, innerHeight / 2);
document.getElementById("zoomOut").onclick = () => zoomAt(0.8, innerWidth / 2, innerHeight / 2);
document.getElementById("reset").onclick = () => { tx = 60; ty = innerHeight / 2; scale = 1; apply(); };
function setAll(n, v) { n.expanded = v; n.children.forEach(c => setAll(c, v)); }

function fit() {
  subtreeH(DATA);
  let maxRight = 0;
  (function scan(n) { maxRight = Math.max(maxRight, n.x + nodeW(n)); n.children.forEach(scan); })(DATA);
  const totalH = subtreeH(DATA);
  const s = Math.min(1.05, (innerWidth - 120) / (maxRight + 40), (innerHeight - 90) / (totalH + 60));
  scale = clampScale(s);
  tx = 40; ty = (innerHeight - totalH * scale) / 2;
  apply();
}

/* ---------- 搜索 ---------- */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  scene.querySelectorAll("rect,text").forEach(el => el.classList.remove("hl", "hlb", "hlt"));
  if (!q) return;
  const hits = [];
  (function scan(n) {
    if (n.text.toLowerCase().includes(q)) {
      hits.push(n);
      let p = n; const chain = [];
      while (p) { chain.push(p); p = p.parent; }
      chain.forEach(x => x.expanded = true);
    }
    n.children.forEach(scan);
  })(DATA);
  draw();
  scene.querySelectorAll("g[data-id]").forEach(g => {
    const t = g.dataset.id.toLowerCase();
    if (t.includes(q)) {
      g.querySelector("rect").classList.add("hlb");
      const tt = g.querySelector("text");
      if (tt) tt.classList.add("hlt");
    }
  });
});

/* 绑定 parent 链 */
(function bind(n, p) { n.parent = p; n.children.forEach(c => bind(c, n)); })(DATA, null);

/* ---------- 启动 ---------- */
document.getElementById("cnt").textContent = TOTAL + " 个概念 · 12 层 + 4 个关系附录";
setAll(DATA, false);
DATA.children.forEach(c => c.expanded = true);
DATA.expanded = true;
draw();
apply();
addEventListener("resize", () => { apply(); });
</script>
</body>
